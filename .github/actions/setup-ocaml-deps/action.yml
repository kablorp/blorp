name: Setup OCaml dependencies
description: Set up OCaml, restore the opam dependency cache, and install locked dependencies.

inputs:
  cache-key:
    description: Fully derived key for the opam dependency cache.
    required: true
  dune-cache:
    description: Whether ocaml/setup-ocaml should enable Dune's shared cache.
    required: false
    default: 'true'
  ocaml-compiler:
    description: OCaml compiler package to install.
    required: true

runs:
  using: composite
  steps:
    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}
        dune-cache: ${{ inputs.dune-cache }}

    - name: Resolve opam dependency cache path
      id: opam-deps-cache
      shell: bash
      run: |
        set -euo pipefail
        prefix="$(opam var prefix)"
        case "$prefix" in
          ""|"."|"$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE/")
            echo "Refusing to cache suspicious opam prefix: '$prefix'" >&2
            exit 1
            ;;
        esac
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

    - name: Restore opam dependency cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.opam-deps-cache.outputs.prefix }}
        key: ${{ inputs.cache-key }}

    - name: Remove restored workspace spillover
      shell: bash
      run: |
        set -euo pipefail
        prefix="${{ steps.opam-deps-cache.outputs.prefix }}"
        if [[ "$prefix" == "$GITHUB_WORKSPACE/"* ]]; then
          git clean -ffdx -e "${prefix#$GITHUB_WORKSPACE/}"
        else
          git clean -ffdx
        fi

    - name: Install dependencies
      shell: bash
      run: opam install ./compiler/blorp.opam --deps-only --with-test --locked -y
