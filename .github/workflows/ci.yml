name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ubuntu:
    name: Linux x64 / Clang
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-latest
      c_compiler: clang
      test_lanes: |
        [
          {
            "scope": "compiler-internal",
            "display_name": "Quality",
            "timeout_minutes": 45,
            "gates": "",
            "run_quality_checks": true,
            "run_rebuilt_cli": false
          },
          {
            "scope": "compiler-blorp",
            "display_name": "Test — Compiler",
            "timeout_minutes": 45,
            "gates": "compiler-blorp compiler-new",
            "compiler_test_progress": 1,
            "run_rebuilt_cli": true
          },
          {
            "scope": "product",
            "display_name": "Test — Product",
            "timeout_minutes": 45,
            "gates": "runtime leak doctest cli lsp package",
            "run_rebuilt_cli": false
          },
          {
            "scope": "blorp-2",
            "display_name": "Test — Blorp 2",
            "timeout_minutes": 45,
            "gates": "",
            "run_quality_checks": false,
            "run_rebuilt_cli": false
          }
        ]

  ubuntu_gcc:
    name: Linux x64 / GCC
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-latest
      c_compiler: gcc
      test_lanes: |
        [
          {
            "scope": "blorp-2",
            "display_name": "Test — Blorp 2",
            "timeout_minutes": 45,
            "gates": "",
            "run_quality_checks": false,
            "run_rebuilt_cli": false
          }
        ]

  linux_arm:
    name: Linux ARM64
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-24.04-arm
      test_lanes: |
        [
          {
            "scope": "platform",
            "display_name": "Test — Product",
            "timeout_minutes": 45,
            "gates": "runtime leak cli lsp",
            "run_rebuilt_cli": true
          },
          {
            "scope": "blorp-2",
            "display_name": "Test — Blorp 2",
            "timeout_minutes": 45,
            "gates": "",
            "run_quality_checks": false,
            "run_rebuilt_cli": false
          }
        ]

  macos:
    name: macOS
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: macos-15
      test_lanes: |
        [
          {
            "scope": "platform",
            "display_name": "Test — Product",
            "timeout_minutes": 45,
            "gates": "runtime leak cli lsp",
            "run_rebuilt_cli": true
          },
          {
            "scope": "blorp-2",
            "display_name": "Test — Blorp 2",
            "timeout_minutes": 45,
            "gates": "",
            "run_quality_checks": false,
            "run_rebuilt_cli": false
          }
        ]
