name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu test lanes
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-latest
      test_lanes: |
        [
          {
            "scope": "compiler-internal",
            "timeout_minutes": 45,
            "gates": "compiler-unit compiler-unit-deep compiler",
            "run_compiler_checks": true,
            "check_self_hosting": true,
            "run_stage_two": false
          },
          {
            "scope": "compiler-blorp",
            "timeout_minutes": 45,
            "gates": "compiler-blorp",
            "run_compiler_checks": false,
            "check_self_hosting": false,
            "run_stage_two": true
          },
          {
            "scope": "product",
            "timeout_minutes": 45,
            "gates": "runtime leak doctest cli lsp package",
            "run_compiler_checks": false,
            "check_self_hosting": false,
            "run_stage_two": false
          }
        ]

  linux_arm:
    name: Linux ARM test lanes
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-24.04-arm
      test_lanes: |
        [
          {
            "scope": "platform",
            "timeout_minutes": 45,
            "gates": "runtime leak cli lsp",
            "run_compiler_checks": false,
            "check_self_hosting": false,
            "run_stage_two": true
          }
        ]

  macos:
    name: macOS test lanes
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: macos-15
      test_lanes: |
        [
          {
            "scope": "platform",
            "timeout_minutes": 45,
            "gates": "runtime leak cli lsp",
            "run_compiler_checks": false,
            "check_self_hosting": false,
            "run_stage_two": true
          }
        ]

  ubuntu-status:
    name: Test (ubuntu-latest)
    needs: ubuntu
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Ubuntu lanes
        env:
          PLATFORM_RESULT: ${{ needs.ubuntu.result }}
        run: test "$PLATFORM_RESULT" = success

  linux_arm_status:
    name: Test (ubuntu-24.04-arm)
    needs: linux_arm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Linux ARM lanes
        env:
          PLATFORM_RESULT: ${{ needs.linux_arm.result }}
        run: test "$PLATFORM_RESULT" = success

  macos-status:
    name: Test (macos-15)
    needs: macos
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful macOS lanes
        env:
          PLATFORM_RESULT: ${{ needs.macos.result }}
        run: test "$PLATFORM_RESULT" = success
