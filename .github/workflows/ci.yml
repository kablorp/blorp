name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          dune-cache: false

      - name: Resolve opam dependency cache path
        id: opam-deps-cache
        shell: bash
        run: echo "switch=$(opam var switch)" >> "$GITHUB_OUTPUT"

      - name: Restore opam dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.opam-deps-cache.outputs.switch }}
          key: opam-deps-v1-${{ matrix.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ hashFiles('compiler/blorp.opam.locked') }}

      - name: Install dependencies
        run: opam install ./compiler/blorp.opam --deps-only --with-test --locked -y

      - name: Build compiler
        run: opam exec -- make

      - name: Run quality checks
        run: opam exec -- make quality-full

      - name: Verify built compiler state
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git status --short
          test -x ./blorp
          ./blorp --version
          test -f compiler/lib/embedded_std.ml
          ! grep -q 'let digest = "missing"' compiler/lib/embedded_std.ml
          grep -q 'opaque type Duration = Int' compiler/lib/embedded_std.ml
          grep -q 'parse_rfc3339' compiler/lib/embedded_std.ml
          grep -q 'match Env.get_opaque_alias' compiler/lib/typecheck.ml
          ./blorp check --no-format tests/test_compiler/typecheck/should_pass/opaque_duration_struct_field.brp
          tmp_c="${RUNNER_TEMP:-/tmp}/time_runtime_helpers.c"
          ./blorp compile --no-format -o "$tmp_c" tests/test_compiler/codegen_audit/should_pass/time_runtime_helpers.brp
          grep -q 'blorp_time_parse_rfc3339' "$tmp_c"

      - name: Run test suites
        run: |
          set -o pipefail
          rm -rf "$HOME/.cache/blorp" "${TMPDIR:-/tmp}"/blorp-std-preflight-*
          opam exec -- env BLORP_TEST_TIMEOUT=30 BLORP_TEST_PREFLIGHT_CACHE=0 bash scripts/test --serial 2>&1 | tee test_output.txt

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test_output.txt
