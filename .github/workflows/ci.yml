name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ubuntu:
    name: Linux x64 / Clang
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-latest
      c_compiler: clang
      test_lanes: |
        [
          {
            "scope": "compiler-internal",
            "display_name": "Quality",
            "timeout_minutes": 45,
            "gates": "",
            "run_quality_checks": true,
            "run_rebuilt_cli": false
          },
          {
            "scope": "compiler-blorp",
            "display_name": "Test — Compiler",
            "timeout_minutes": 45,
            "gates": "compiler-blorp compiler-new",
            "compiler_test_progress": 1,
            "run_rebuilt_cli": true
          },
          {
            "scope": "product",
            "display_name": "Test — Product",
            "timeout_minutes": 45,
            "gates": "runtime leak doctest cli lsp package",
            "run_rebuilt_cli": false
          }
        ]

  linux_arm:
    name: Linux ARM64
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-24.04-arm
      test_lanes: |
        [
          {
            "scope": "platform",
            "display_name": "Test — Product",
            "timeout_minutes": 45,
            "gates": "runtime leak cli lsp",
            "run_rebuilt_cli": true
          }
        ]

  macos:
    name: macOS
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: macos-15
      test_lanes: |
        [
          {
            "scope": "platform",
            "display_name": "Test — Product",
            "timeout_minutes": 45,
            "gates": "runtime leak cli lsp",
            "run_rebuilt_cli": true
          }
        ]

  blorp2:
    name: Blorp 2 / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 Clang
            runner: ubuntu-latest
            compiler: clang
          - name: Linux x64 GCC
            runner: ubuntu-latest
            compiler: gcc
          - name: Linux ARM64 Clang
            runner: ubuntu-24.04-arm
            compiler: clang
          - name: macOS ARM64 Clang
            runner: macos-15
            compiler: clang
    env:
      BLORP_CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y "$BLORP_CC"
      - name: Run self-hosted components
        run: |
          set -euo pipefail
          make -C blorp_2 test 2>&1 | tee blorp_2_test_output.txt
      - name: Retain self-hosted test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blorp2-tests-${{ matrix.runner }}-${{ matrix.compiler }}
          path: blorp_2_test_output.txt
