name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          dune-cache: false

      - name: Resolve opam dependency cache path
        id: opam-deps-cache
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(opam var prefix)"
          case "$prefix" in
            ""|"."|"$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE/")
              echo "Refusing to cache suspicious opam prefix: '$prefix'" >&2
              exit 1
              ;;
          esac
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Restore opam dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.opam-deps-cache.outputs.prefix }}
          key: opam-deps-${{ matrix.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ hashFiles('compiler/blorp.opam.locked', '.github/cache/opam-deps-cache-spec.txt') }}

      - name: Remove restored workspace spillover
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ steps.opam-deps-cache.outputs.prefix }}"
          if [[ "$prefix" == "$GITHUB_WORKSPACE/"* ]]; then
            git clean -ffdx -e "${prefix#$GITHUB_WORKSPACE/}"
          else
            git clean -ffdx
          fi

      - name: Install dependencies
        run: opam install ./compiler/blorp.opam --deps-only --with-test --locked -y

      - name: Build compiler
        run: opam exec -- make

      - name: Run quality checks
        run: opam exec -- make quality-full

      - name: Run test suites
        run: |
          set -o pipefail
          rm -rf "$HOME/.cache/blorp" "${TMPDIR:-/tmp}"/blorp-std-preflight-*
          opam exec -- env BLORP_TEST_TIMEOUT=30 BLORP_TEST_PREFLIGHT_CACHE=0 bash scripts/test --serial 2>&1 | tee test_output.txt

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test_output.txt
