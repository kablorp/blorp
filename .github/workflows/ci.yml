name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI Docker image
        if: runner.os == 'Linux'
        id: ci-image
        uses: ./.github/actions/prepare-ci-docker-image
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

      - name: Run Linux test gate in Docker
        if: runner.os == 'Linux'
        env:
          BLORP_DOCKER_IMAGE: ${{ steps.ci-image.outputs.image }}
          BLORP_TEST_TIMEOUT: 30
        run: |
          set -o pipefail
          scripts/docker-gate --ci-gate --platform "${{ steps.ci-image.outputs.platform }}" -- --serial 2>&1 | tee test_output.txt

      - name: Setup OCaml
        if: runner.os == 'macOS'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          dune-cache: true

      - name: Resolve opam dependency cache path
        if: runner.os == 'macOS'
        id: opam-deps-cache
        shell: bash
        run: echo "switch=$(opam var switch)" >> "$GITHUB_OUTPUT"

      - name: Restore opam dependency cache
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ steps.opam-deps-cache.outputs.switch }}
          key: opam-deps-v1-${{ matrix.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ hashFiles('compiler/blorp.opam.locked') }}

      - name: Install dependencies
        if: runner.os == 'macOS'
        run: opam install ./compiler/blorp.opam --deps-only --with-test --locked -y

      - name: Build compiler
        if: runner.os == 'macOS'
        run: opam exec -- make

      - name: Run quality checks
        if: runner.os == 'macOS'
        run: opam exec -- make quality-full

      - name: Run test suites
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          opam exec -- env BLORP_TEST_TIMEOUT=30 bash scripts/test --serial 2>&1 | tee test_output.txt

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test_output.txt
