name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Setup cached OCaml
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          runner-label: ${{ matrix.os }}

      - name: Build compiler
        run: opam exec -- make

      - name: Run quality checks
        if: matrix.os == 'ubuntu-latest'
        run: opam exec -- make quality-full

      - name: Run test suites
        run: |
          set -o pipefail
          opam exec -- env BLORP_TEST_TIMEOUT=30 bash scripts/test --serial 2>&1 | tee test_output.txt

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test_output.txt
