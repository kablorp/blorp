name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14'

      - name: Install dependencies
        run: opam install ./compiler/blorp.opam --deps-only --with-test -y

      - name: Build compiler
        run: opam exec -- make

      - name: Run quality checks
        run: opam exec -- make quality

      - name: Run unit tests
        run: opam exec -- bash scripts/run_tests.sh unit

      - name: Run compiler tests
        run: opam exec -- bash scripts/run_tests.sh compiler

      - name: Run runtime tests
        continue-on-error: true
        run: opam exec -- bash scripts/run_tests.sh runtime 2>&1 | tee test_output.txt

      - name: Run doctests
        continue-on-error: true
        run: opam exec -- bash scripts/run_tests.sh doctest

      - name: Run SIMD tests
        continue-on-error: true
        run: opam exec -- ./blorp test --no-cache tests/test_blorp/simd/

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test_output.txt

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run benchmarks
        continue-on-error: true
        run: opam exec -- bash benchmarks/bench.sh 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: benchmark_output.txt
