name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu test lanes
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-latest
      test_lanes: |
        [
          {
            "scope": "compiler-internal",
            "timeout_minutes": 45,
            "gates": "",
            "run_quality_checks": true,
            "run_stage_two": false
          },
          {
            "scope": "compiler-blorp",
            "timeout_minutes": 45,
            "gates": "compiler-blorp",
            "compiler_test_shard_index": 1,
            "compiler_test_shard_count": 2,
            "compiler_test_progress": 1,
            "run_stage_two": false
          },
          {
            "scope": "compiler-blorp-2",
            "timeout_minutes": 45,
            "gates": "compiler-blorp",
            "compiler_test_shard_index": 2,
            "compiler_test_shard_count": 2,
            "compiler_test_progress": 1,
            "run_stage_two": true
          },
          {
            "scope": "product",
            "timeout_minutes": 45,
            "gates": "runtime leak doctest cli lsp package",
            "run_stage_two": false
          }
        ]

  linux_arm:
    name: Linux ARM test lanes
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: ubuntu-24.04-arm
      test_lanes: |
        [
          {
            "scope": "platform",
            "timeout_minutes": 45,
            "gates": "runtime leak cli lsp",
            "run_stage_two": true
          }
        ]

  macos:
    name: macOS test lanes
    uses: ./.github/workflows/ci-platform.yml
    with:
      runner: macos-15
      test_lanes: |
        [
          {
            "scope": "platform",
            "timeout_minutes": 45,
            "gates": "runtime leak cli lsp",
            "run_stage_two": true
          }
        ]
