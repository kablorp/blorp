name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2
  BLORP_COMPILER_BOOTSTRAP_TAG: dev-33e00c2b94df

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Blorp compiler bootstrap
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-${{ env.BLORP_COMPILER_BOOTSTRAP_TAG }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prewarm Blorp compiler bootstrap
        run: scripts/blorp-compiler-bootstrap --print-path

      - name: Cache Blorp compiler bridge helpers
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bridge
          key: blorp-compiler-bridge-v1-${{ env.BLORP_COMPILER_BOOTSTRAP_TAG }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-compiler-bridge-v1-${{ env.BLORP_COMPILER_BOOTSTRAP_TAG }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Setup cached OCaml
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          runner-label: ${{ matrix.os }}

      - name: Cache Dune build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dune
            ~/Library/Caches/dune
          key: dune-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ github.sha }}
          restore-keys: |
            dune-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-

      - name: Cache generated Blorp CLI
        uses: actions/cache@v4
        with:
          path: compiler/_build/blorp-cli
          key: blorp-cli-v1-${{ env.BLORP_COMPILER_BOOTSTRAP_TAG }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/**/*.ml', 'compiler/**/*.mli', 'compiler/**/dune', 'compiler/dune-project', 'compiler/blorp.opam.locked', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-cli-v1-${{ env.BLORP_COMPILER_BOOTSTRAP_TAG }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build compiler
        run: opam exec -- make install

      - name: Run quality checks
        if: matrix.os == 'ubuntu-latest'
        run: opam exec -- make quality

      - name: Run test suites
        run: |
          set -o pipefail
          opam exec -- env BLORP_TEST_TIMEOUT=30 bash scripts/test --serial 2>&1 | tee test_output.txt

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test_output.txt
