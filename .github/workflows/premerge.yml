name: Premerge Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: read
  packages: write

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  premerge-gate:
    name: Premerge gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI Docker image
        id: ci-image
        uses: ./.github/actions/prepare-ci-docker-image
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          registry-username: ${{ github.actor }}
          registry-token: ${{ github.token }}

      - name: Run premerge gate
        env:
          BLORP_DOCKER_IMAGE: ${{ steps.ci-image.outputs.image }}
          BLORP_TEST_TIMEOUT: 30
        run: |
          set -o pipefail
          scripts/docker-gate --premerge-gate --platform "${{ steps.ci-image.outputs.platform }}" 2>&1 | tee premerge_gate_output.txt

      - name: Upload premerge gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-gate-output
          path: premerge_gate_output.txt
