name: Premerge Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

jobs:
  premerge-gate:
    name: Premerge gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14'
          dune-cache: true

      - name: Install dependencies
        run: |
          opam install ./compiler/blorp.opam --deps-only --with-test -y
          opam install ocamlformat -y

      - name: Run premerge gate
        run: |
          set -o pipefail
          opam exec -- env BLORP_TEST_TIMEOUT=30 bash scripts/premerge-gate --no-docker 2>&1 | tee premerge_gate_output.txt

      - name: Upload premerge gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-gate-output
          path: premerge_gate_output.txt
