name: Premerge Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  premerge-gate:
    name: Premerge gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Setup OCaml dependencies
        uses: ./.github/actions/setup-ocaml-deps
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          cache-key: opam-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ hashFiles('compiler/blorp.opam.locked', '.github/cache/opam-deps-cache-spec.txt') }}

      - name: Run premerge gate
        run: |
          set -o pipefail
          opam exec -- env BLORP_TEST_TIMEOUT=30 bash scripts/premerge-gate --no-docker 2>&1 | tee premerge_gate_output.txt

      - name: Upload premerge gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-gate-output
          path: premerge_gate_output.txt
