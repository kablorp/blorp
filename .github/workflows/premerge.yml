name: Premerge Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2
  BLORP_COMPILER_BOOTSTRAP_TAG: dev-33e00c2b94df

jobs:
  premerge-gate:
    name: Premerge gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Blorp compiler bootstrap
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-${{ env.BLORP_COMPILER_BOOTSTRAP_TAG }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prewarm Blorp compiler bootstrap
        run: scripts/blorp-compiler-bootstrap --print-path

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Setup cached OCaml
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          runner-label: ubuntu-latest

      - name: Run premerge gate
        run: |
          set -o pipefail
          opam exec -- env BLORP_TEST_TIMEOUT=30 bash scripts/premerge-gate --no-docker 2>&1 | tee premerge_gate_output.txt

      - name: Upload premerge gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-gate-output
          path: premerge_gate_output.txt
