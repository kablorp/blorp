name: Premerge Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  premerge-gate:
    name: Premerge gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          dune-cache: true

      - name: Resolve opam dependency cache path
        id: opam-deps-cache
        shell: bash
        run: |
          set -euo pipefail
          prefix="$(opam var prefix)"
          case "$prefix" in
            ""|"."|"$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE/")
              echo "Refusing to cache suspicious opam prefix: '$prefix'" >&2
              exit 1
              ;;
          esac
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Restore opam dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.opam-deps-cache.outputs.prefix }}
          key: opam-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ hashFiles('compiler/blorp.opam.locked', '.github/cache/opam-deps-cache-spec.txt') }}

      - name: Remove restored workspace spillover
        shell: bash
        run: |
          set -euo pipefail
          prefix="${{ steps.opam-deps-cache.outputs.prefix }}"
          if [[ "$prefix" == "$GITHUB_WORKSPACE/"* ]]; then
            git clean -ffdx -e "${prefix#$GITHUB_WORKSPACE/}"
          else
            git clean -ffdx
          fi

      - name: Install dependencies
        run: opam install ./compiler/blorp.opam --deps-only --with-test --locked -y

      - name: Run premerge gate
        run: |
          set -o pipefail
          opam exec -- env BLORP_TEST_TIMEOUT=30 bash scripts/premerge-gate --no-docker 2>&1 | tee premerge_gate_output.txt

      - name: Upload premerge gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-gate-output
          path: premerge_gate_output.txt
