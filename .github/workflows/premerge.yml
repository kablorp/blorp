name: Premerge

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

env:
  BLORP_COMPILER_TEST_TIMEOUT: 360

jobs:
  premerge-gate:
    name: Linux x64 / Full
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read bootstrap pin
        id: compiler-bootstrap
        shell: bash
        run: echo "tag=$(scripts/blorp-compiler-bootstrap --print-tag)" >> "$GITHUB_OUTPUT"

      - name: Cache bootstrap compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-v2-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config

      - name: Cache compiler build
        uses: actions/cache@v4
        with:
          path: blorp/build/_build/blorp-cli
          key: blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('blorp/src/**', 'standard_library/src/**/*.brp', 'blorp/build/bootstrap.env', 'blorp/tool/*.brp', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Run premerge gate
        run: |
          set -o pipefail
          env BLORP_TEST_TIMEOUT=30 BLORP_RUNTIME_TEST_TIMEOUT=60 BLORP_LEAK_TEST_TIMEOUT=60 bash scripts/premerge-gate --no-clean --no-docker 2>&1 | tee premerge_gate_output.txt

      - name: Upload premerge gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-gate-output
          path: premerge_gate_output.txt
