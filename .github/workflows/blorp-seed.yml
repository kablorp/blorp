name: Blorp seed

# Production generations use the immutable seed pinned by this checkout.
# Only explicitly self-hosted suites run.
# blorp.yml calls this after a push to main passes its tests; a manual run
# publishes the head of the selected ref. The seed tag names the source commit.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            instructions: disabled
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            instructions: disabled
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            instructions: disabled
    env:
      BLORP_CC: clang
      LC_ALL: C
      SEED_TARGET: ${{ matrix.target }}
      BLORP_INSTRUCTION_CHECK: ${{ matrix.instructions }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate source and native target
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(scripts/target-triple)" = "$SEED_TARGET"
          test -r blorp/bootstrap.env
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          mkdir -p build/blorp-seed/provenance
          printf '%s\n' "$source_sha" > build/blorp-seed/provenance/source-commit.txt

      - name: Observe hosted macOS time report without cost qualification
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Hosted retired-instruction measurement is disabled; this report does not qualify instruction costs.'
          /usr/bin/time -l /usr/bin/true 2>&1 | tee build/blorp-seed/provenance/host-time-preflight.log

      - name: Install Linux host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang binutils

      - name: Generate the embedded standard library module
        shell: bash
        run: |
          set -euo pipefail
          # src/common/analysis/load/load.brp imports this generated, untracked module.
          make -C blorp build/generated/embedded_library.brp

      - name: Build reference A from the pinned seed
        shell: bash
        run: |
          set -euo pipefail
          work=build/blorp-seed
          scripts/blorp-compiler-bootstrap --print-id > "$work/provenance/seed-identity.txt"
          seed_binary=$(scripts/blorp-compiler-bootstrap --print-path)
          shasum -a 256 "$seed_binary" > "$work/provenance/seed.sha256"
          cp blorp/bootstrap.env "$work/provenance/bootstrap.env"
          # The seed runs directly, not through the resolver, which names the
          # seed on stderr: this step proves the seed itself prints nothing.
          "$seed_binary" compile blorp/src/main.brp \
            --library-root blorp/standard_library -o "$work/reference-a.c" \
            > "$work/provenance/reference-a.stdout" 2> "$work/provenance/reference-a.stderr"
          test ! -s "$work/provenance/reference-a.stdout"
          test ! -s "$work/provenance/reference-a.stderr"
          clang -O0 -DBLORP_MEMORY_DIAGNOSTICS=0 "$work/reference-a.c" \
            -o "$work/reference-a" -lm -lpthread > "$work/provenance/reference-a-link.log" 2>&1
          test ! -s "$work/provenance/reference-a-link.log"
          shasum -a 256 "$work/reference-a.c" "$work/reference-a" > "$work/provenance/reference-a.sha256"

      - name: A emits B and B reproduces its compiler C
        shell: bash
        run: |
          set -euo pipefail
          work=build/blorp-seed
          env -u BLORP_LEAK_CHECK -u BLORP_MEMORY_STATS "$work/reference-a" \
            compile blorp/src/main.brp --library-root blorp/standard_library -o "$work/compiler.c" \
            > "$work/provenance/a-emits.stdout" 2> "$work/provenance/a-emits.stderr"
          test ! -s "$work/provenance/a-emits.stdout"
          test ! -s "$work/provenance/a-emits.stderr"
          clang -O0 -DBLORP_MEMORY_DIAGNOSTICS=0 "$work/compiler.c" \
            -o "$work/compiler-b" -lm -lpthread > "$work/provenance/b-normal-link.log" 2>&1
          test ! -s "$work/provenance/b-normal-link.log"
          clang -O0 -DBLORP_MEMORY_DIAGNOSTICS=1 "$work/compiler.c" \
            -o "$work/compiler-b-diagnostic" -lm -lpthread > "$work/provenance/b-diagnostic-link.log" 2>&1
          test ! -s "$work/provenance/b-diagnostic-link.log"
          clang -O0 -DBLORP_MEMORY_DIAGNOSTICS=1 -fsanitize=address,undefined \
            -fno-sanitize-recover=all "$work/compiler.c" -o "$work/compiler-b-sanitized" \
            -lm -lpthread > "$work/provenance/b-sanitized-link.log" 2>&1
          test ! -s "$work/provenance/b-sanitized-link.log"
          env -u BLORP_LEAK_CHECK -u BLORP_MEMORY_STATS "$work/compiler-b" \
            compile blorp/src/main.brp --library-root blorp/standard_library -o "$work/reproduced.c" \
            > "$work/provenance/b-emits.stdout" 2> "$work/provenance/b-emits.stderr"
          test ! -s "$work/provenance/b-emits.stdout"
          test ! -s "$work/provenance/b-emits.stderr"
          cmp "$work/compiler.c" "$work/reproduced.c"
          shasum -a 256 "$work/compiler.c" "$work/reproduced.c" "$work/compiler-b" \
            "$work/compiler-b-diagnostic" "$work/compiler-b-sanitized" > "$work/provenance/b.sha256"

      - name: Every maintained fixture under A and B
        shell: bash
        run: |
          set -euo pipefail
          work=build/blorp-seed
          parity=$work/provenance/fixture-parity
          fixture_root=blorp/test/test_compile/fixtures
          mkdir -p "$parity"
          find "$fixture_root" -name '*.brp' | LC_ALL=C sort > "$parity/fixtures.txt"
          test -s "$parity/fixtures.txt"
          count=0
          accepted=0
          rejected=0
          while IFS= read -r fixture; do
            shasum -a 256 "$fixture" >> "$parity/fixtures.sha256"
            relative=${fixture#"$fixture_root"/}
            for stage in a b; do
              case "$stage" in a) compiler=$work/reference-a ;; b) compiler=$work/compiler-b ;; esac
              out=$parity/$stage/$relative
              mkdir -p "$(dirname "$out")"
              status=0
              env -u BLORP_LEAK_CHECK -u BLORP_MEMORY_STATS "$compiler" \
                compile "$fixture" --library-root blorp/standard_library -o "$out.c" \
                < /dev/null > "$out.stdout" 2> "$out.stderr" || status=$?
              printf '%s\n' "$status" > "$out.exit"
              shasum -a 256 "$out.exit" "$out.stdout" "$out.stderr" > "$out.sha256"
              if [ -e "$out.c" ]; then shasum -a 256 "$out.c" >> "$out.sha256"; fi
              case "$status" in
                0)
                  test -s "$out.c"
                  test ! -s "$out.stdout"
                  test ! -s "$out.stderr" ;;
                1)
                  test ! -e "$out.c"
                  test ! -s "$out.stdout"
                  test -s "$out.stderr" ;;
                *) echo "Invalid compiler exit $status for $stage on $fixture" >&2; exit 1 ;;
              esac
            done
            out_a=$parity/a/$relative
            out_b=$parity/b/$relative
            for part in exit stdout stderr; do cmp "$out_a.$part" "$out_b.$part"; done
            if [ -e "$out_a.c" ] || [ -e "$out_b.c" ]; then
              test -e "$out_a.c" && test -e "$out_b.c"
              cmp "$out_a.c" "$out_b.c"
            fi
            count=$((count + 1))
            if [ "$(cat "$out_a.exit")" = 0 ]; then accepted=$((accepted + 1)); else rejected=$((rejected + 1)); fi
          done < "$parity/fixtures.txt"
          test "$count" -eq "$(wc -l < "$parity/fixtures.txt" | tr -d ' ')"
          printf 'identical=%s\naccepted=%s\nrejected=%s\n' "$count" "$accepted" "$rejected" > "$parity/counts.txt"

      - name: Strict compiler accounting and ordinary B main smoke
        shell: bash
        run: |
          set -euo pipefail
          work=build/blorp-seed
          env -u BLORP_MEMORY_STATS BLORP_LEAK_CHECK=strict "$work/compiler-b-sanitized" \
            compile blorp/src/main.brp --library-root blorp/standard_library -o "$work/accounted.c" \
            > "$work/provenance/b-accounted.stdout" 2> "$work/provenance/b-accounted.stderr"
          test ! -s "$work/provenance/b-accounted.stdout"
          report=$(cat "$work/provenance/b-accounted.stderr")
          if [[ ! "$report" =~ ^blorp:\ leak\ check:\ ([0-9]+)\ allocs,\ ([0-9]+)\ releases,\ 0\ leaked,\ 0\ bytes$ ]] ||
             [ "${BASH_REMATCH[1]:-0}" != "${BASH_REMATCH[2]:-}" ] ||
             [ "${BASH_REMATCH[1]:-0}" -le 0 ]; then
            echo "Expected one positive balanced strict compiler report." >&2
            exit 1
          fi
          printf '%s\n' "$report" > "$work/provenance/expected-accounting.txt"
          cmp "$work/provenance/expected-accounting.txt" "$work/provenance/b-accounted.stderr"
          cmp "$work/compiler.c" "$work/accounted.c"
          env -u BLORP_LEAK_CHECK -u BLORP_MEMORY_STATS "$work/compiler-b" \
            compile blorp/test/test_compile/fixtures/return/zero.brp --library-root blorp/standard_library -o "$work/smoke.c" \
            > "$work/provenance/smoke-compile.stdout" 2> "$work/provenance/smoke-compile.stderr"
          test ! -s "$work/provenance/smoke-compile.stdout"
          test ! -s "$work/provenance/smoke-compile.stderr"
          clang -std=c11 -Wall -Wextra -Werror -pedantic -O0 -fsanitize=address,undefined \
            -fno-sanitize-recover=all -DBLORP_MEMORY_DIAGNOSTICS=1 "$work/smoke.c" \
            -o "$work/smoke" -lm > "$work/provenance/smoke-link.log" 2>&1
          env -u BLORP_MEMORY_STATS BLORP_LEAK_CHECK=strict "$work/smoke" \
            > "$work/provenance/smoke.stdout" 2> "$work/provenance/smoke.stderr"
          test ! -s "$work/provenance/smoke.stdout"
          printf 'blorp: leak check: 0 allocs, 0 releases, 0 leaked, 0 bytes\n' > "$work/provenance/smoke-expected.stderr"
          cmp "$work/provenance/smoke-expected.stderr" "$work/provenance/smoke.stderr"

      - name: Self-hosted components and first native e2e under B
        shell: bash
        run: |
          set -euo pipefail
          work=build/blorp-seed
          make -C blorp test-target-components BLORP_TEST_COMPILER="$PWD/$work/compiler-b-diagnostic" \
            2>&1 | tee "$work/provenance/components.log"
          make -C blorp test-e2e BLORP_TEST_COMPILER="$PWD/$work/compiler-b-diagnostic" \
            2>&1 | tee "$work/provenance/native.log"

      - name: Record source, platform and toolchain provenance
        shell: bash
        run: |
          set -euo pipefail
          work=build/blorp-seed
          qualified_input_status=$(git status --porcelain -- blorp/src blorp/test blorp/standard_library .github/workflows/blorp-seed.yml blorp/bootstrap.env)
          test -z "$qualified_input_status"
          for tree in blorp/src blorp/standard_library; do
            inventory=${tree//\//-}
            git ls-files -z -- "$tree" | while IFS= read -r -d '' path; do
              shasum -a 256 "$path"
            done > "$work/provenance/$inventory.sha256"
            test -s "$work/provenance/$inventory.sha256"
          done
          {
            echo 'producer=pinned-seed-then-self-built-b'
            echo "target=$SEED_TARGET"
            echo "instructions=$BLORP_INSTRUCTION_CHECK"
            echo 'instruction_qualification=unmeasured-not-qualified'
            echo 'compiler_c_flags=-O0'
            echo 'normal_macro=BLORP_MEMORY_DIAGNOSTICS=0'
            echo 'diagnostic_macro=BLORP_MEMORY_DIAGNOSTICS=1'
            echo 'strict_compiler=compiler-b-sanitized'
            echo 'strict_compiler_flags=-O0 -DBLORP_MEMORY_DIAGNOSTICS=1 -fsanitize=address,undefined -fno-sanitize-recover=all'
            echo 'link_libraries=-lm -lpthread'
            echo 'functional_qualification=self-hosted-components-first-native-e2e-fixpoint-smoke-fixture-parity'
            echo 'self_hosted_components=PASS'
            echo 'compiler_fixpoint=PASS'
            echo 'native_smoke=PASS'
            echo 'first_native_e2e=PASS (selected fixtures plus process lifecycle tests)'
            echo 'full_native_e2e=DEFERRED'
            echo 'resource_qualification=unmeasured-not-qualified'
            echo 'native_resource_budget_checks=DEFERRED'
            echo 'fixture_parity=fixture-parity/counts.txt'
            echo 'b_link_diagnostics=empty-required'
            echo "source=$(git rev-parse HEAD)"
            echo "source_date=$(git show -s --format=%cI HEAD)"
            uname -a
          } > "$work/provenance/provenance.txt"
          clang --version > "$work/provenance/clang-version.txt"
          file "$work/compiler-b" > "$work/provenance/b-file.txt"
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(lipo -archs "$work/compiler-b")" = arm64
            sw_vers > "$work/provenance/os-version.txt"
            xcodebuild -version > "$work/provenance/xcode-version.txt"
            xcrun --show-sdk-version > "$work/provenance/sdk-version.txt"
            otool -l "$work/compiler-b" > "$work/provenance/b-load-commands.txt"
            otool -L "$work/compiler-b" > "$work/provenance/b-dependencies.txt"
          else
            readelf -h "$work/compiler-b" > "$work/provenance/b-elf-header.txt"
            case "$SEED_TARGET" in
              x86_64-unknown-linux-gnu) grep -Eq 'Machine:.*Advanced Micro Devices X86-64' "$work/provenance/b-elf-header.txt" ;;
              aarch64-unknown-linux-gnu) grep -Eq 'Machine:.*AArch64' "$work/provenance/b-elf-header.txt" ;;
              *) exit 1 ;;
            esac
            cat /etc/os-release > "$work/provenance/os-version.txt"
            getconf GNU_LIBC_VERSION > "$work/provenance/libc-version.txt"
            ldd "$work/compiler-b" > "$work/provenance/b-dependencies.txt"
            ld --version > "$work/provenance/linker-version.txt"
          fi
          cp .github/workflows/blorp-seed.yml "$work/provenance/workflow.yml"

      - name: Package only the self-built B normal seed
        shell: bash
        run: |
          set -euo pipefail
          work=build/blorp-seed
          mkdir -p dist
          cp "$work/compiler-b" "dist/blorp-$SEED_TARGET"
          chmod 0755 "dist/blorp-$SEED_TARGET"
          gzip -n -c "$work/compiler.c" > "dist/blorp-compiler-$SEED_TARGET.c.gz"
          tar -czf "dist/blorp-provenance-$SEED_TARGET.tar.gz" -C "$work" provenance

      - name: Retain qualification logs, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blorp-qualification-${{ matrix.target }}
          path: |
            build/blorp-seed/provenance
            build/blorp-seed/*.c
            build/source-patterns/native-subset01/artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Upload qualified seed candidate
        uses: actions/upload-artifact@v6
        with:
          name: blorp-seed-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: blorp-seed-*
          merge-multiple: true
          path: dist
      - name: Validate complete release and publish once
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          seed_tag="blorp-seed-${source_sha:0:12}"
          # GITHUB_TOKEN cannot create a ref at a commit whose workflow tree
          # differs from the default branch, as release.yml also records. A
          # later Blorp push publishes its own seed.
          git fetch --quiet --no-tags origin main
          if ! git diff --quiet "$source_sha" FETCH_HEAD -- .github/workflows; then
            echo "::warning title=Seed not published::Skipping $seed_tag because its workflows differ from current main."
            exit 0
          fi
          # Existing immutable releases remain available to pinned checkouts.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > existing-release-tags.txt
          if grep -Fxq "$seed_tag" existing-release-tags.txt; then
            echo "This immutable seed release already exists; never overwrite it." >&2
            exit 1
          fi
          targets=(aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu)
          shopt -s nullglob
          candidates=(dist/*)
          test "${#candidates[@]}" -eq 9
          mkdir -p proof
          first=${targets[0]}
          for target in "${targets[@]}"; do
            test -s "dist/blorp-$target"
            test -s "dist/blorp-compiler-$target.c.gz"
            test -s "dist/blorp-provenance-$target.tar.gz"
            mkdir -p "proof/$target"
            tar -xzf "dist/blorp-provenance-$target.tar.gz" -C "proof/$target"
            test "$(cat "proof/$target/provenance/source-commit.txt")" = "$source_sha"
            gzip -dc "dist/blorp-compiler-$target.c.gz" > "proof/$target/compiler.c"
            expected_binary=$(awk '$2 == "build/blorp-seed/compiler-b" {print $1}' "proof/$target/provenance/b.sha256")
            expected_c=$(awk '$2 == "build/blorp-seed/compiler.c" {print $1}' "proof/$target/provenance/b.sha256")
            [[ "$expected_binary" =~ ^[0-9a-f]{64}$ ]]
            [[ "$expected_c" =~ ^[0-9a-f]{64}$ ]]
            test "$(sha256sum "dist/blorp-$target" | cut -d ' ' -f 1)" = "$expected_binary"
            test "$(sha256sum "proof/$target/compiler.c" | cut -d ' ' -f 1)" = "$expected_c"
            cmp "proof/$first/compiler.c" "proof/$target/compiler.c"
            for inventory in blorp-src blorp-standard_library; do
              cmp "proof/$first/provenance/$inventory.sha256" "proof/$target/provenance/$inventory.sha256"
            done
          done
          cp "dist/blorp-compiler-$first.c.gz" dist/blorp-compiler.c.gz
          for target in "${targets[@]}"; do rm "dist/blorp-compiler-$target.c.gz"; done
          (cd dist && sha256sum blorp-* > SHA256SUMS)
          cat > release-notes.md <<NOTES
          Blorp seed built by itself from $source_sha.
          All three platforms emitted identical compiler C (SHA-256 $expected_c). Gate logs are in each provenance archive.
          NOTES
          gh release create "$seed_tag" dist/* --target "$source_sha" --prerelease --latest=false \
            --title "Blorp seed ${source_sha:0:12}" --notes-file release-notes.md
