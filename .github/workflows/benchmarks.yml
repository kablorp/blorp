name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

jobs:
  benchmarks:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install dependencies
        run: opam install ./compiler/blorp.opam --deps-only --with-test -y

      - name: Build compiler
        run: opam exec -- make

      - name: Run benchmarks
        run: |
          set -o pipefail
          opam exec -- bash benchmarks/bench.sh 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-linux
          path: benchmark_output.txt
