name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  benchmarks:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          dune-cache: true

      - name: Resolve opam dependency cache path
        id: opam-deps-cache
        shell: bash
        run: echo "switch=$(opam var switch)" >> "$GITHUB_OUTPUT"

      - name: Restore opam dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.opam-deps-cache.outputs.switch }}
          key: opam-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ hashFiles('compiler/blorp.opam.locked') }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install dependencies
        run: opam install ./compiler/blorp.opam --deps-only --with-test --locked -y

      - name: Build compiler
        run: opam exec -- make

      - name: Run benchmarks
        run: |
          set -o pipefail
          opam exec -- bash benchmarks/bench.sh 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-linux
          path: benchmark_output.txt
