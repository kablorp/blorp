name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  benchmarks:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        # OCaml is benchmark input only; production builds do not require it.
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev ocaml-nox pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download tested compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          target=$(scripts/target-triple)
          run_json=$(gh run list --workflow CI --commit "$sha" --status success --limit 20 --json databaseId,event,headSha)
          run_id=$(jq -r --arg sha "$sha" '.[] | select(.event == "push" and .headSha == $sha) | .databaseId' <<<"$run_json" | head -n 1)
          if [ -z "$run_id" ]; then
            echo "No successful CI toolchain is available for $sha." >&2
            exit 1
          fi
          artifact_dir=$(mktemp -d "${RUNNER_TEMP}/blorp-benchmark-toolchain.XXXXXX")
          gh run download "$run_id" --name "blorp-$target" --dir "$artifact_dir"
          binary_path="$artifact_dir/blorp-$target"
          if [ ! -f "$binary_path" ]; then
            echo "The CI toolchain artifact for $sha has no $target compiler." >&2
            exit 1
          fi
          mkdir -p bin
          cp "$binary_path" bin/blorp
          chmod +x bin/blorp
          bin/blorp --version | grep -F "commit: $sha"

      - name: Run benchmarks
        run: |
          set -o pipefail
          benchmarks/compiler_typecheck_memory \
            --type-depth 1 \
            --probes-per-module 1 \
            --runs 1 \
            --warmup-runs 0 \
            --json >/dev/null
          bash benchmarks/bench.sh 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-linux
          path: benchmark_output.txt
