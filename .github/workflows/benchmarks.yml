name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

permissions:
  actions: read
  contents: read

jobs:
  benchmarks:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Setup cached OCaml
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          runner-label: ubuntu-latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download tested compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          target=$(scripts/target-triple)
          run_json=$(gh run list --workflow CI --commit "$sha" --status success --limit 20 --json databaseId,event,headSha)
          run_id=$(jq -r --arg sha "$sha" '.[] | select(.event == "push" and .headSha == $sha) | .databaseId' <<<"$run_json" | head -n 1)
          if [ -z "$run_id" ]; then
            echo "No successful CI toolchain is available for $sha." >&2
            exit 1
          fi
          artifact_dir=$(mktemp -d "${RUNNER_TEMP}/blorp-benchmark-toolchain.XXXXXX")
          gh run download "$run_id" --name "blorp-$target" --dir "$artifact_dir"
          archive=$(find "$artifact_dir" -name "blorp-*-$target.tar.gz" -type f -print -quit)
          if [ -z "$archive" ]; then
            echo "The CI toolchain artifact for $sha has no $target archive." >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$artifact_dir"
          binary_path=$(find "$artifact_dir" -type f -name blorp -print -quit)
          if [ -z "$binary_path" ]; then
            echo "The CI toolchain artifact for $sha has no public compiler." >&2
            exit 1
          fi
          cp "$binary_path" ./blorp
          chmod +x ./blorp
          ./blorp --version | grep -F "commit: $sha"

      - name: Run benchmarks
        run: |
          set -o pipefail
          benchmarks/compiler_typecheck_memory \
            --type-depth 1 \
            --probes-per-module 1 \
            --runs 1 \
            --warmup-runs 0 \
            --json >/dev/null
          opam exec -- bash benchmarks/bench.sh 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-linux
          path: benchmark_output.txt
