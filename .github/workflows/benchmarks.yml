name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

permissions:
  contents: read

jobs:
  benchmarks:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        # OCaml is benchmark input only; production builds do not require it.
        run: sudo apt-get update && sudo apt-get install -y clang ocaml-nox

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Build the Blorp compiler
        run: make -C blorp compiler

      - name: Run benchmarks
        run: |
          set -o pipefail
          bash benchmarks/bench.sh 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-linux
          path: benchmark_output.txt
