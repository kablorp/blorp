name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  benchmarks:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Setup cached OCaml
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build compiler
        run: opam exec -- make

      - name: Run benchmarks
        run: |
          set -o pipefail
          opam exec -- bash benchmarks/bench.sh 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-linux
          path: benchmark_output.txt
