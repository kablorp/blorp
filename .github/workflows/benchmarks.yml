name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  benchmarks:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Blorp compiler bootstrap
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/blorp-compiler-bootstrap-pin.sh') }}-${{ hashFiles('scripts/blorp-compiler-bootstrap') }}

      - name: Prewarm Blorp compiler bootstrap
        run: scripts/blorp-compiler-bootstrap --print-path

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Setup cached OCaml
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          runner-label: ubuntu-latest

      - name: Cache Dune build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dune
            ~/Library/Caches/dune
          key: dune-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ github.sha }}
          restore-keys: |
            dune-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Cache Blorp compiler bridge helpers
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bridge
          key: blorp-compiler-bridge-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/blorp-compiler-bootstrap-pin.sh') }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h') }}
          restore-keys: |
            blorp-compiler-bridge-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/blorp-compiler-bootstrap-pin.sh') }}-

      - name: Cache generated Blorp CLI
        uses: actions/cache@v4
        with:
          path: compiler/_build/blorp-cli
          key: blorp-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/blorp-compiler-bootstrap-pin.sh') }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/**/*.ml', 'compiler/**/*.mli', 'compiler/**/dune', 'compiler/dune-project', 'compiler/blorp.opam.locked', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h') }}
          restore-keys: |
            blorp-cli-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/blorp-compiler-bootstrap-pin.sh') }}-

      - name: Build compiler
        run: opam exec -- make install

      - name: Run benchmarks
        run: |
          set -o pipefail
          opam exec -- bash benchmarks/bench.sh 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-linux
          path: benchmark_output.txt
