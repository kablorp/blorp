name: Release Binaries

# Publish the toolchains preserved by successful main CI. Independently build
# immutable tagged releases because their embedded version differs from dev.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  build:
    name: Build tagged binary (${{ matrix.os }})
    if: >-
      ${{
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Read Blorp compiler bootstrap manifest
        id: compiler-bootstrap
        shell: bash
        run: echo "tag=$(scripts/blorp-compiler-bootstrap --print-tag)" >> "$GITHUB_OUTPUT"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Cache Blorp compiler bootstrap
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-v2-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prewarm Blorp compiler bootstrap
        run: scripts/blorp-compiler-bootstrap --print-path

      - name: Setup cached OCaml
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          runner-label: ${{ matrix.os }}

      - name: Cache Dune build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dune
            ~/Library/Caches/dune
          key: dune-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-${{ github.sha }}
          restore-keys: |
            dune-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.OCAML_COMPILER }}-

      - name: Cache Blorp compiler bridge helpers
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bridge
          key: blorp-compiler-bridge-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/bootstrap.env', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-compiler-bridge-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target=$(scripts/target-triple)
          source_sha=$(git rev-parse HEAD)
          short_sha=${source_sha:0:12}
          source_version=$(sed -n 's/^let source_version = "\(.*\)"/\1/p' compiler/lib/version.ml)

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
            if [[ "$version" == *-* ]]; then
              channel="preview"
            else
              channel="release"
            fi
          else
            version="${source_version}-dev.${short_sha}"
            channel="dev"
          fi

          {
            echo "target=$target"
            echo "source_sha=$source_sha"
            echo "short_sha=$short_sha"
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: Cache generated Blorp CLI
        uses: actions/cache@v4
        with:
          path: compiler/_build/blorp-cli
          key: blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.source_sha }}-${{ steps.meta.outputs.target }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/bootstrap.env', 'compiler/**/*.ml', 'compiler/**/*.mli', 'compiler/**/dune', 'compiler/dune-project', 'compiler/blorp.opam.locked', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.source_sha }}-${{ steps.meta.outputs.target }}-

      - name: Build compiler
        env:
          BLORP_BUILD_VERSION: ${{ steps.meta.outputs.version }}
          BLORP_BUILD_COMMIT: ${{ steps.meta.outputs.source_sha }}
          BLORP_BUILD_TARGET: ${{ steps.meta.outputs.target }}
          BLORP_BUILD_CHANNEL: ${{ steps.meta.outputs.channel }}
          BLORP_BUILD_DIRTY: 'false'
        run: |
          opam exec -- make install
          ./blorp --version

      - name: Prepare packaged compiler bridges
        run: |
          set -euo pipefail
          current_toolchain="${RUNNER_TEMP}/blorp-current-toolchain"
          rm -rf "$current_toolchain"
          mkdir -p "$current_toolchain" compiler/_build/release-bridges
          # The current compiler still delegates to private workers beside it.
          # Stage the complete installed toolchain before compiling its successors.
          for executable in \
            blorp \
            blorp-ocaml-host \
            blorp-ocaml-middle \
            blorp-compiler-renderer \
            blorp-compiler-parser \
            blorp-compiler-typecheck
          do
            cp "$executable" "$current_toolchain/$executable"
          done
          BLORP_COMPILER_BRIDGE_BIN="$current_toolchain/blorp" \
            ./blorp __compiler-bridge-prepare compiler/_build/release-bridges

      - name: Package binary
        env:
          BLORP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          BLORP_RELEASE_TARGET: ${{ steps.meta.outputs.target }}
          BLORP_RELEASE_RENDERER_BRIDGE: compiler/_build/release-bridges/compiler_renderer_bridge.bin
          BLORP_RELEASE_PARSER_BRIDGE: compiler/_build/release-bridges/compiler_parser_bridge.bin
          BLORP_RELEASE_TYPECHECK_BRIDGE: compiler/_build/release-bridges/compiler_typecheck_bridge.bin
        run: scripts/package-release dist

      - name: Smoke packaged toolchain
        shell: bash
        env:
          BLORP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          BLORP_RELEASE_COMMIT: ${{ steps.meta.outputs.source_sha }}
          BLORP_RELEASE_TARGET: ${{ steps.meta.outputs.target }}
          BLORP_RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          package_root=$(mktemp -d "${RUNNER_TEMP}/blorp-package-smoke.XXXXXX")
          trap 'rm -rf "$package_root"' EXIT
          archive_base="blorp-${BLORP_RELEASE_VERSION}-${BLORP_RELEASE_TARGET}"
          tar -xzf "dist/${archive_base}.tar.gz" -C "$package_root"
          package_dir="$package_root/$archive_base"
          test -x "$package_dir/blorp-bootstrap-compiler"
          source_root="$PWD"
          cd "$package_root"
          version_output=$("$package_dir/blorp" --version)
          grep -Fxq "blorp ${BLORP_RELEASE_VERSION}" <<<"$version_output"
          grep -Fxq "commit: ${BLORP_RELEASE_COMMIT}" <<<"$version_output"
          grep -Fxq "target: ${BLORP_RELEASE_TARGET}" <<<"$version_output"
          grep -Fxq "channel: ${BLORP_RELEASE_CHANNEL}" <<<"$version_output"
          grep -Fxq "dirty: false" <<<"$version_output"
          "$package_dir/blorp" check --no-format \
            "$source_root/compiler/blorp/src/stage_12_cli/compiler_parser_bridge_cli.brp"
          "$package_dir/blorp" compile --no-format \
            -o "$package_root/empty_main.c" \
            "$source_root/tests/test_blorp/memory/leak_check_baselines/empty_main.brp"
          "$package_dir/blorp" test --no-format --no-cache --timeout 5 \
            "$source_root/tests/test_blorp/types/test_bool.brp"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: blorp-${{ steps.meta.outputs.target }}
          path: dist/*
          compression-level: 0

  publish:
    name: Publish release
    needs: build
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            needs.build.result == 'skipped'
          ) ||
          (
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v') &&
            needs.build.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Download tested CI binaries
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: blorp-*
          merge-multiple: true
          path: dist

      - name: Download tagged release binaries
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: blorp-*
          merge-multiple: true
          path: dist

      - name: Compute publish metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          short_sha=${source_sha:0:12}
          source_version=$(sed -n 's/^let source_version = "\(.*\)"/\1/p' compiler/lib/version.ml)

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
            tag="$REF_NAME"
            title="Blorp ${version}"
            snapshot_tag=""
            if [[ "$version" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          else
            version="${source_version}-dev.${short_sha}"
            tag="dev"
            snapshot_tag="dev-${short_sha}"
            title="Blorp dev ${short_sha}"
            prerelease="true"
          fi

          {
            echo "source_sha=$source_sha"
            echo "short_sha=$short_sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "snapshot_tag=$snapshot_tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            aarch64-apple-darwin
          )
          shopt -s nullglob
          assets=(dist/*)
          archives=(dist/blorp-"${version}"-*.tar.gz)
          checksums=(dist/blorp-"${version}"-*.tar.gz.sha256)
          if [ ${#assets[@]} -ne $((${#targets[@]} * 2)) ] ||
            [ ${#archives[@]} -ne ${#targets[@]} ] ||
            [ ${#checksums[@]} -ne ${#targets[@]} ]
          then
            echo "Expected only one archive and checksum for each release target." >&2
            printf 'Assets: %s\n' "${assets[*]:-none}" >&2
            printf 'Archives: %s\n' "${archives[*]:-none}" >&2
            printf 'Checksums: %s\n' "${checksums[*]:-none}" >&2
            exit 1
          fi

          for target in "${targets[@]}"; do
            archive="dist/blorp-${version}-${target}.tar.gz"
            checksum="${archive}.sha256"
            if [ ! -f "$archive" ] || [ ! -f "$checksum" ]; then
              echo "Missing release assets for ${target}." >&2
              exit 1
            fi
            expected=$(awk 'NF { print $1; exit }' "$checksum")
            actual=$(shasum -a 256 "$archive" | awk '{ print $1 }')
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]] || [ "$actual" != "$expected" ]; then
              echo "Release checksum mismatch for ${target}." >&2
              exit 1
            fi
          done

      - name: Add stable dev asset aliases
        if: ${{ steps.meta.outputs.tag == 'dev' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          shopt -s nullglob
          archives=(dist/blorp-"${version}"-*.tar.gz)

          if [ ${#archives[@]} -eq 0 ]; then
            echo "No versioned dev archives found for ${version}" >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            base=$(basename "$archive" .tar.gz)
            target="${base#blorp-${version}-}"
            alias="dist/blorp-dev-${target}.tar.gz"

            cp "$archive" "$alias"
            (
              cd dist
              shasum -a 256 "$(basename "$alias")" > "$(basename "$alias").sha256"
            )
          done

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.meta.outputs.tag }}" = "dev" ]; then
            cat > release-notes.md <<EOF
          Automated dev build from main.

          Commit: ${{ steps.meta.outputs.source_sha }}
          Immutable dev tag: ${{ steps.meta.outputs.snapshot_tag }}
          Moving latest tag: dev

          This release is for dogfooding and early testing. Prefer versioned releases for stable preview downloads.
          EOF
          else
            cat > release-notes.md <<EOF
          Blorp ${{ steps.meta.outputs.version }}.

          Commit: ${{ steps.meta.outputs.source_sha }}
          EOF
          fi

      - name: Publish immutable dev release
        if: ${{ steps.meta.outputs.tag == 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_tag="${{ steps.meta.outputs.snapshot_tag }}"
          source_sha="${{ steps.meta.outputs.source_sha }}"

          existing_tag_sha=$(git ls-remote --tags origin "refs/tags/${snapshot_tag}" | awk 'NR == 1 {print $1}')
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$source_sha" ]; then
            echo "Immutable dev tag exists at a different commit: $snapshot_tag" >&2
            echo "expected: $source_sha" >&2
            echo "actual:   $existing_tag_sha" >&2
            exit 1
          fi

          if gh release view "$snapshot_tag" >/dev/null 2>&1; then
            echo "Immutable dev release already exists; leaving it untouched: $snapshot_tag"
            exit 0
          fi

          if [ -z "$existing_tag_sha" ]; then
            git tag "$snapshot_tag" "$source_sha"
            git push origin "$snapshot_tag"
          fi

          gh release create "$snapshot_tag" dist/* \
            --prerelease \
            --latest=false \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file release-notes.md

      - name: Publish moving dev release
        if: ${{ steps.meta.outputs.tag == 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete dev --yes --cleanup-tag || true
          git tag -f dev "${{ steps.meta.outputs.source_sha }}"
          git push -f origin dev
          gh release create dev dist/* \
            --prerelease \
            --latest=false \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file release-notes.md

      - name: Publish tagged release
        if: ${{ steps.meta.outputs.tag != 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release already exists: ${{ steps.meta.outputs.tag }}" >&2
            exit 1
          fi

          args=(
            release create "${{ steps.meta.outputs.tag }}"
            dist/*
            --verify-tag
            --title "${{ steps.meta.outputs.title }}"
            --notes-file release-notes.md
          )
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"
