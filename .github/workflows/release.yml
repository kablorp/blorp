name: Release Binaries

# Publish the toolchains preserved by successful main CI. Independently build
# immutable tagged releases because their embedded version differs from dev.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build tagged binary (${{ matrix.os }})
    if: >-
      ${{
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Read Blorp compiler bootstrap manifest
        id: compiler-bootstrap
        shell: bash
        run: echo "tag=$(scripts/blorp-compiler-bootstrap --print-tag)" >> "$GITHUB_OUTPUT"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config

      - name: Cache Blorp compiler bootstrap
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-v2-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target=$(scripts/target-triple)
          source_sha=$(git rev-parse HEAD)
          short_sha=${source_sha:0:12}
          source_version=$(cat compiler/VERSION)

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
            if [[ "$version" == *-* ]]; then
              channel="preview"
            else
              channel="release"
            fi
          else
            version="${source_version}-dev.${short_sha}"
            channel="dev"
          fi

          {
            echo "target=$target"
            echo "source_sha=$source_sha"
            echo "short_sha=$short_sha"
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: Cache generated Blorp CLI
        uses: actions/cache@v4
        with:
          path: compiler/_build/blorp-cli
          key: blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.source_sha }}-${{ steps.meta.outputs.target }}-${{ hashFiles('compiler/src/**/*.brp', 'std/**/*.brp', 'compiler/bootstrap.env', 'compiler/tools/*.brp', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.source_sha }}-${{ steps.meta.outputs.target }}-

      - name: Build compiler
        env:
          BLORP_BUILD_VERSION: ${{ steps.meta.outputs.version }}
          BLORP_BUILD_COMMIT: ${{ steps.meta.outputs.source_sha }}
          BLORP_BUILD_TARGET: ${{ steps.meta.outputs.target }}
          BLORP_BUILD_CHANNEL: ${{ steps.meta.outputs.channel }}
          BLORP_BUILD_DIRTY: 'false'
          BLORP_CLI_C_OPTIMIZATION: -Og
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            make -j2 install
          else
            make install
          fi
          ./blorp --version

      - name: Package binary
        env:
          BLORP_RELEASE_TARGET: ${{ steps.meta.outputs.target }}
        run: scripts/package-release dist

      - name: Smoke packaged compiler
        shell: bash
        env:
          BLORP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          BLORP_RELEASE_COMMIT: ${{ steps.meta.outputs.source_sha }}
          BLORP_RELEASE_TARGET: ${{ steps.meta.outputs.target }}
          BLORP_RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          package_root=$(mktemp -d "${RUNNER_TEMP}/blorp-package-smoke.XXXXXX")
          trap 'rm -rf "$package_root"' EXIT
          release_binary="$PWD/dist/blorp-${BLORP_RELEASE_TARGET}"
          test -x "$release_binary"
          isolated_compiler_dir="$package_root/isolated-compiler"
          mkdir -p "$isolated_compiler_dir"
          cp "$release_binary" "$isolated_compiler_dir/blorp"
          "$isolated_compiler_dir/blorp" compile --no-format \
            -o "$package_root/isolated-empty-main.c" \
            "$PWD/tests/test_blorp/memory/leak_check_baselines/empty_main.brp"
          test -s "$package_root/isolated-empty-main.c"
          source_root="$PWD"
          cd "$package_root"
          version_output=$("$isolated_compiler_dir/blorp" --version)
          grep -Fxq "blorp ${BLORP_RELEASE_VERSION}" <<<"$version_output"
          grep -Fxq "commit: ${BLORP_RELEASE_COMMIT}" <<<"$version_output"
          grep -Fxq "target: ${BLORP_RELEASE_TARGET}" <<<"$version_output"
          grep -Fxq "channel: ${BLORP_RELEASE_CHANNEL}" <<<"$version_output"
          grep -Fxq "dirty: false" <<<"$version_output"
          "$isolated_compiler_dir/blorp" check --no-format \
            "$source_root/compiler/src/stage_12_cli/main.brp"
          printf 'func helper(x: Int) -> Int:\n\tx + 1\n' > "$package_root/purify-smoke.brp"
          "$isolated_compiler_dir/blorp" purify --dry-run "$package_root/purify-smoke.brp"
          "$isolated_compiler_dir/blorp" test --timeout 5 \
            "$source_root/tests/test_blorp/types/test_bool.brp"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: blorp-${{ steps.meta.outputs.target }}
          path: dist/blorp-${{ steps.meta.outputs.target }}
          compression-level: 0

  publish:
    name: Publish release
    needs: build
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            needs.build.result == 'skipped'
          ) ||
          (
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v') &&
            needs.build.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dev runs may be coalesced while one publisher is active. Each surviving
    # run resolves the latest successful CI below, so pending replacement cannot
    # publish an older toolchain. Versioned tags use independent groups.
    concurrency:
      group: >-
        ${{
          github.event_name == 'workflow_run' &&
          'blorp-dev-release' ||
          format('blorp-tag-release-{0}', github.ref_name)
        }}
      cancel-in-progress: false

    steps:
      - name: Resolve latest successful main CI
        id: dev-ci
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_ci=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1")
          run_id=$(jq -r '.workflow_runs[0].id // empty' <<<"$latest_ci")
          source_sha=$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$latest_ci")
          if [ -z "$run_id" ] || [ -z "$source_sha" ]; then
            echo "Could not resolve the latest successful main CI run." >&2
            exit 1
          fi
          {
            echo "run_id=$run_id"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.dev-ci.outputs.source_sha || github.ref }}

      - name: Download tested CI binaries
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.dev-ci.outputs.run_id }}
          pattern: blorp-*
          merge-multiple: true
          path: dist

      - name: Download tagged release binaries
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: blorp-*
          merge-multiple: true
          path: dist

      - name: Compute publish metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          short_sha=${source_sha:0:12}
          source_version=$(cat compiler/VERSION)

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
            tag="$REF_NAME"
            title="Blorp ${version}"
            snapshot_tag=""
            if [[ "$version" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          else
            version="${source_version}-dev.${short_sha}"
            tag="dev"
            snapshot_tag="dev-${short_sha}"
            title="Blorp dev ${short_sha}"
            prerelease="true"
          fi

          {
            echo "source_sha=$source_sha"
            echo "short_sha=$short_sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "snapshot_tag=$snapshot_tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Check dev release authorization
        id: dev-source
        if: ${{ steps.meta.outputs.tag == 'dev' }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ steps.meta.outputs.source_sha }}"
          git fetch --quiet --no-tags origin main
          current_main_sha=$(git rev-parse FETCH_HEAD)

          if git diff --quiet "$source_sha" "$current_main_sha" -- .github/workflows; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Could not compare release workflow files with current main." >&2
              exit 1
            fi
            # GITHUB_TOKEN cannot create refs for a successful commit after its
            # workflow tree diverges from the default branch.
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded dev release::Skipping $source_sha because its workflows differ from current main."
          fi

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            aarch64-apple-darwin
          )
          shopt -s nullglob
          assets=(dist/blorp-*)
          if [ ${#assets[@]} -ne ${#targets[@]} ]; then
            echo "Expected exactly one compiler binary for each release target." >&2
            printf 'Assets: %s\n' "${assets[*]:-none}" >&2
            exit 1
          fi

          for target in "${targets[@]}"; do
            binary="dist/blorp-${target}"
            if [ ! -s "$binary" ]; then
              echo "Missing release binary for ${target}." >&2
              exit 1
            fi
          done

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.meta.outputs.tag }}" = "dev" ]; then
            cat > release-notes.md <<EOF
          Automated dev build from main.

          Commit: ${{ steps.meta.outputs.source_sha }}
          Immutable dev tag: ${{ steps.meta.outputs.snapshot_tag }}
          Moving latest tag: dev

          This release is for dogfooding and early testing. Prefer versioned releases for stable preview downloads.
          EOF
          else
            cat > release-notes.md <<EOF
          Blorp ${{ steps.meta.outputs.version }}.

          Commit: ${{ steps.meta.outputs.source_sha }}
          EOF
          fi

      - name: Publish immutable dev release
        if: >-
          ${{
            steps.meta.outputs.tag == 'dev' &&
            steps.dev-source.outputs.publish == 'true'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_tag="${{ steps.meta.outputs.snapshot_tag }}"
          source_sha="${{ steps.meta.outputs.source_sha }}"

          workflow_files_match_main() {
            git fetch --quiet --no-tags origin main || return 2
            current_main_sha=$(git rev-parse FETCH_HEAD) || return 2
            git diff --quiet "$source_sha" "$current_main_sha" -- .github/workflows
          }

          existing_tag_sha=$(git ls-remote --tags origin "refs/tags/${snapshot_tag}" | awk 'NR == 1 {print $1}')
          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$source_sha" ]; then
            echo "Immutable dev tag exists at a different commit: $snapshot_tag" >&2
            echo "expected: $source_sha" >&2
            echo "actual:   $existing_tag_sha" >&2
            exit 1
          fi

          if gh release view "$snapshot_tag" >/dev/null 2>&1; then
            echo "Immutable dev release already exists; leaving it untouched: $snapshot_tag"
            exit 0
          fi

          if [ -z "$existing_tag_sha" ]; then
            git tag "$snapshot_tag" "$source_sha"
            if ! push_output=$(git push origin "$snapshot_tag" 2>&1); then
              if workflow_files_match_main; then
                printf '%s\n' "$push_output" >&2
                exit 1
              else
                status=$?
                if [ "$status" -eq 1 ]; then
                  echo "::notice title=Superseded dev release::Skipping $snapshot_tag because main changed its workflow files during publication."
                  exit 0
                fi
                printf '%s\n' "$push_output" >&2
                echo "Could not recheck release workflow files against current main." >&2
                exit 1
              fi
            fi
          fi

          gh release create "$snapshot_tag" dist/* \
            --prerelease \
            --latest=false \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file release-notes.md

      - name: Publish moving dev release
        if: >-
          ${{
            steps.meta.outputs.tag == 'dev' &&
            steps.dev-source.outputs.publish == 'true'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ steps.meta.outputs.source_sha }}"

          workflow_files_match_main() {
            git fetch --quiet --no-tags origin main || return 2
            current_main_sha=$(git rev-parse FETCH_HEAD) || return 2
            git diff --quiet "$source_sha" "$current_main_sha" -- .github/workflows
          }

          git tag -f dev "$source_sha"
          if ! push_output=$(git push -f origin dev 2>&1); then
            if workflow_files_match_main; then
              printf '%s\n' "$push_output" >&2
              exit 1
            else
              status=$?
              if [ "$status" -eq 1 ]; then
                echo "::notice title=Superseded dev release::Not moving dev because main changed its workflow files during publication."
                exit 0
              fi
              printf '%s\n' "$push_output" >&2
              echo "Could not recheck release workflow files against current main." >&2
              exit 1
            fi
          fi

          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --yes
          fi
          gh release create dev dist/* \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file release-notes.md

      - name: Publish tagged release
        if: ${{ steps.meta.outputs.tag != 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release already exists: ${{ steps.meta.outputs.tag }}" >&2
            exit 1
          fi

          args=(
            release create "${{ steps.meta.outputs.tag }}"
            dist/*
            --verify-tag
            --title "${{ steps.meta.outputs.title }}"
            --notes-file release-notes.md
          )
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"
