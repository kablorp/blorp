name: Blorp 2

# Blorp 2 and the scripts that build and prove it. A push to main that passes
# every platform then publishes that commit's seed through blorp2-seed.yml.
on:
  push:
    branches: [main]
    paths:
      - 'blorp_2/**'
      - 'scripts/blorp2-compiler-bootstrap'
      - 'scripts/blorp2-fixpoint'
      - '.github/workflows/blorp2.yml'
      - '.github/workflows/blorp2-seed.yml'
  pull_request:
    branches: [main]
    paths:
      - 'blorp_2/**'
      - 'scripts/blorp2-compiler-bootstrap'
      - 'scripts/blorp2-fixpoint'
      - '.github/workflows/blorp2.yml'
      - '.github/workflows/blorp2-seed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 Clang
            runner: ubuntu-latest
            compiler: clang
          - name: Linux x64 GCC
            runner: ubuntu-latest
            compiler: gcc
          - name: Linux ARM64 Clang
            runner: ubuntu-24.04-arm
            compiler: clang
          - name: macOS ARM64 Clang
            runner: macos-15
            compiler: clang
    env:
      BLORP_CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y "$BLORP_CC"
      - name: Run self-hosted components and native e2e
        run: |
          set -euo pipefail
          make -C blorp_2 test 2>&1 | tee blorp_2_test_output.txt
      - name: Retain self-hosted test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blorp2-tests-${{ matrix.runner }}-${{ matrix.compiler }}
          path: blorp_2_test_output.txt

  seed:
    name: Seed
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/blorp2-seed.yml
