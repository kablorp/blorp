name: CI Platform

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label for this platform.
        required: true
        type: string
      test_lanes:
        description: JSON array of independently budgeted test lane definitions.
        required: true
        type: string

env:
  OCAML_COMPILER: ocaml-base-compiler.4.14.2

jobs:
  build-toolchain:
    name: Build toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release candidate metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          target=$(scripts/target-triple)
          source_sha=$(git rev-parse HEAD)
          short_sha=${source_sha:0:12}
          source_version=$(sed -n 's/^let source_version = "\(.*\)"/\1/p' compiler/lib/version.ml)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            version="${source_version}-dev.${short_sha}"
            channel="dev"
          else
            version="${source_version}-ci.${short_sha}"
            channel="ci"
          fi

          {
            echo "target=$target"
            echo "source_sha=$source_sha"
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          {
            echo "BLORP_BUILD_VERSION=$version"
            echo "BLORP_BUILD_COMMIT=$source_sha"
            echo "BLORP_BUILD_TARGET=$target"
            echo "BLORP_BUILD_CHANNEL=$channel"
            echo "BLORP_BUILD_DIRTY=false"
          } >> "$GITHUB_ENV"

      - name: Read Blorp compiler bootstrap manifest
        id: compiler-bootstrap
        shell: bash
        run: echo "tag=$(scripts/blorp-compiler-bootstrap --print-tag)" >> "$GITHUB_OUTPUT"

      - name: Cache Blorp compiler bootstrap
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-v2-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prewarm Blorp compiler bootstrap
        run: scripts/blorp-compiler-bootstrap --print-path

      - name: Cache Blorp compiler bridge helpers
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bridge
          key: blorp-compiler-bridge-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/bootstrap.env', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-compiler-bridge-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Setup cached OCaml
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          runner-label: ${{ inputs.runner }}

      - name: Cache generated Blorp CLI
        uses: actions/cache@v4
        with:
          path: compiler/_build/blorp-cli
          key: blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.release-meta.outputs.version }}-${{ steps.release-meta.outputs.source_sha }}-${{ steps.release-meta.outputs.target }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/bootstrap.env', 'compiler/**/*.ml', 'compiler/**/*.mli', 'compiler/**/dune', 'compiler/dune-project', 'compiler/blorp.opam.locked', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.release-meta.outputs.version }}-${{ steps.release-meta.outputs.source_sha }}-${{ steps.release-meta.outputs.target }}-

      - name: Build compiler
        env:
          BLORP_BUILD_VERSION: ${{ steps.release-meta.outputs.version }}
          BLORP_BUILD_COMMIT: ${{ steps.release-meta.outputs.source_sha }}
          BLORP_BUILD_TARGET: ${{ steps.release-meta.outputs.target }}
          BLORP_BUILD_CHANNEL: ${{ steps.release-meta.outputs.channel }}
          BLORP_BUILD_DIRTY: 'false'
          BLORP_CLI_C_OPTIMIZATION: -Og
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            opam exec -- make -j2 install
          else
            opam exec -- make install
          fi

      - name: Prepare tested compiler bridges
        run: |
          set -euo pipefail
          current_toolchain="${RUNNER_TEMP}/blorp-current-toolchain"
          rm -rf "$current_toolchain"
          mkdir -p "$current_toolchain" compiler/_build/release-bridges
          # Bridge generation must use the same complete toolchain later restored by tests.
          for executable in \
            blorp \
            blorp-ocaml-host \
            blorp-compiler-parser
          do
            cp "$executable" "$current_toolchain/$executable"
          done
          BLORP_COMPILER_BRIDGE_BIN="$current_toolchain/blorp" \
            ./blorp __compiler-bridge-prepare compiler/_build/release-bridges

      - name: Bundle compiler candidate
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/ci-toolchain.tar.gz" \
            blorp \
            blorp-ocaml-host \
            blorp-compiler-parser \
            compiler/_build/blorp-cli \
            compiler/_build/release-bridges \
            compiler/lib/embedded_std.ml \
            compiler/blorp/src/stage_01_file_io/embedded_std.brp

      - name: Upload compiler candidate
        uses: actions/upload-artifact@v4
        with:
          name: ci-toolchain-${{ steps.release-meta.outputs.target }}
          path: ${{ runner.temp }}/ci-toolchain.tar.gz
          compression-level: 0

  test:
    name: Test (${{ matrix.scope }})
    needs: build-toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.test_lanes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target triple
        id: target
        shell: bash
        run: echo "value=$(scripts/target-triple)" >> "$GITHUB_OUTPUT"

      - name: Download compiler candidate
        uses: actions/download-artifact@v4
        with:
          name: ci-toolchain-${{ steps.target.outputs.value }}
          path: ${{ runner.temp }}

      - name: Restore compiler candidate
        run: tar -xzf "${RUNNER_TEMP}/ci-toolchain.tar.gz"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Setup cached OCaml
        if: matrix.run_quality_checks
        uses: ./.github/actions/setup-cached-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
          runner-label: ${{ inputs.runner }}

      - name: Read Blorp compiler bootstrap manifest
        if: matrix.run_quality_checks
        id: compiler-bootstrap
        shell: bash
        run: echo "tag=$(scripts/blorp-compiler-bootstrap --print-tag)" >> "$GITHUB_OUTPUT"

      - name: Cache Blorp compiler bootstrap
        if: matrix.run_quality_checks
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-v2-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

      - name: Prewarm Blorp compiler bootstrap
        if: matrix.run_quality_checks
        run: scripts/blorp-compiler-bootstrap --print-path

      - name: Select compiler bridge toolchain
        id: tested-bridges
        shell: bash
        run: |
          set -euo pipefail
          parser="$PWD/compiler/_build/release-bridges/compiler_parser_bridge.bin"
          for executable in "$PWD/blorp" "$parser"; do
            if [ ! -x "$executable" ]; then
              echo "Compiler toolchain executable is missing: $executable" >&2
              exit 1
            fi
          done
          {
            echo "compiler=$PWD/blorp"
            echo "parser=$parser"
          } >> "$GITHUB_OUTPUT"

      - name: Check compiler self-hosting graph
        if: matrix.run_quality_checks
        env:
          BLORP_COMPILER_BRIDGE_BIN: ${{ steps.tested-bridges.outputs.compiler }}
          BLORP_COMPILER_PARSER_BRIDGE_BIN: ${{ steps.tested-bridges.outputs.parser }}
          BLORP_COMPILER_REQUIRE_PREPARED_BRIDGE: '1'
        run: ./blorp check --no-format compiler/blorp/src/stage_12_cli/parser_bridge_cli.brp

      - name: Run quality checks
        if: matrix.run_quality_checks
        env:
          BLORP_CLI_C_OPTIMIZATION: -Og
        run: opam exec -- make quality

      - name: Test benchmark-only typecheck worker
        if: matrix.run_quality_checks
        run: |
          benchmarks/compiler_typecheck_memory \
            --type-depth 1 \
            --probes-per-module 1 \
            --runs 1 \
            --warmup-runs 0 \
            --json >/dev/null

      - name: Run test suites
        if: matrix.gates != ''
        env:
          BLORP_COMPILER_BRIDGE_BIN: ${{ steps.tested-bridges.outputs.compiler }}
          BLORP_COMPILER_PARSER_BRIDGE_BIN: ${{ steps.tested-bridges.outputs.parser }}
          BLORP_COMPILER_REQUIRE_PREPARED_BRIDGE: '1'
          BLORP_COMPILER_TEST_SHARD_INDEX: ${{ matrix.compiler_test_shard_index }}
          BLORP_COMPILER_TEST_SHARD_COUNT: ${{ matrix.compiler_test_shard_count }}
          BLORP_COMPILER_TEST_PROGRESS: ${{ matrix.compiler_test_progress }}
          BLORP_TEST_TIMEOUT: '30'
          BLORP_COMPILER_TEST_TIMEOUT: '180'
        run: |
          set -o pipefail
          bash scripts/test --no-build --serial ${{ matrix.gates }} 2>&1 | tee test_output.txt

      - name: Verify Blorp-owned test route in a stage-two compiler
        if: matrix.run_stage_two
        env:
          BLORP_COMPILER_BRIDGE_BIN: ${{ steps.tested-bridges.outputs.compiler }}
          BLORP_COMPILER_PARSER_BRIDGE_BIN: ${{ steps.tested-bridges.outputs.parser }}
          BLORP_COMPILER_REQUIRE_PREPARED_BRIDGE: '1'
        run: tests/test_cli_stage_two.sh --timeout 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ steps.target.outputs.value }}-${{ matrix.scope }}
          path: test_output.txt

  package-tested-toolchain:
    name: Package tested toolchain
    needs: [build-toolchain, test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release candidate metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          target=$(scripts/target-triple)
          source_sha=$(git rev-parse HEAD)
          short_sha=${source_sha:0:12}
          source_version=$(sed -n 's/^let source_version = "\(.*\)"/\1/p' compiler/lib/version.ml)
          version="${source_version}-dev.${short_sha}"
          {
            echo "target=$target"
            echo "source_sha=$source_sha"
            echo "version=$version"
            echo "channel=dev"
          } >> "$GITHUB_OUTPUT"

      - name: Download qualified compiler candidate
        uses: actions/download-artifact@v4
        with:
          name: ci-toolchain-${{ steps.release-meta.outputs.target }}
          path: ${{ runner.temp }}

      - name: Restore qualified compiler candidate
        run: tar -xzf "${RUNNER_TEMP}/ci-toolchain.tar.gz"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev m4 pkg-config

      - name: Package tested toolchain
        env:
          BLORP_RELEASE_VERSION: ${{ steps.release-meta.outputs.version }}
          BLORP_RELEASE_TARGET: ${{ steps.release-meta.outputs.target }}
          BLORP_RELEASE_PARSER_BRIDGE: compiler/_build/release-bridges/compiler_parser_bridge.bin
        run: scripts/package-release dist

      - name: Smoke tested toolchain archive
        shell: bash
        env:
          BLORP_RELEASE_VERSION: ${{ steps.release-meta.outputs.version }}
          BLORP_RELEASE_COMMIT: ${{ steps.release-meta.outputs.source_sha }}
          BLORP_RELEASE_TARGET: ${{ steps.release-meta.outputs.target }}
          BLORP_RELEASE_CHANNEL: ${{ steps.release-meta.outputs.channel }}
        run: |
          set -euo pipefail
          package_root=$(mktemp -d "${RUNNER_TEMP}/blorp-package-smoke.XXXXXX")
          trap 'rm -rf "$package_root"' EXIT
          archive_base="blorp-${BLORP_RELEASE_VERSION}-${BLORP_RELEASE_TARGET}"
          tar -xzf "dist/${archive_base}.tar.gz" -C "$package_root"
          package_dir="$package_root/$archive_base"
          isolated_compiler_dir="$package_root/isolated-compiler"
          mkdir -p "$isolated_compiler_dir"
          cp "$package_dir/blorp" "$isolated_compiler_dir/blorp"
          "$isolated_compiler_dir/blorp" compile --no-format \
            -o "$package_root/isolated-empty-main.c" \
            "$PWD/tests/test_blorp/memory/leak_check_baselines/empty_main.brp"
          test -s "$package_root/isolated-empty-main.c"
          for executable in \
            blorp \
            blorp-ocaml-host \
            blorp-compiler-parser
          do
            test -x "$package_dir/$executable"
          done
          source_root="$PWD"
          cd "$package_root"
          version_output=$("$package_dir/blorp" --version)
          grep -Fxq "blorp ${BLORP_RELEASE_VERSION}" <<<"$version_output"
          grep -Fxq "commit: ${BLORP_RELEASE_COMMIT}" <<<"$version_output"
          grep -Fxq "target: ${BLORP_RELEASE_TARGET}" <<<"$version_output"
          grep -Fxq "channel: ${BLORP_RELEASE_CHANNEL}" <<<"$version_output"
          grep -Fxq "dirty: false" <<<"$version_output"
          "$package_dir/blorp" check --no-format \
            "$source_root/compiler/blorp/src/stage_12_cli/parser_bridge_cli.brp"
          "$package_dir/blorp" compile --no-format \
            -o "$package_root/empty_main.c" \
            "$source_root/tests/test_blorp/memory/leak_check_baselines/empty_main.brp"
          printf 'func helper(x: Int) -> Int:\n\tx + 1\n' > "$package_root/purify-smoke.brp"
          "$package_dir/blorp" purify --dry-run "$package_root/purify-smoke.brp"
          "$package_dir/blorp" test --timeout 5 \
            "$source_root/tests/test_blorp/types/test_bool.brp"

      - name: Upload tested toolchain archive
        uses: actions/upload-artifact@v4
        with:
          name: blorp-${{ steps.release-meta.outputs.target }}
          path: dist/*
          compression-level: 0
