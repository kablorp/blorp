name: CI Platform

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label for this platform.
        required: true
        type: string
      test_lanes:
        description: JSON array of independently budgeted test lane definitions.
        required: true
        type: string

jobs:
  build-toolchain:
    name: Build toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      source_sha: ${{ steps.release-meta.outputs.source_sha }}
      target: ${{ steps.release-meta.outputs.target }}
      channel: ${{ steps.release-meta.outputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release candidate metadata
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          target=$(scripts/target-triple)
          source_sha=$(git rev-parse HEAD)
          short_sha=${source_sha:0:12}
          source_version=$(cat compiler/VERSION)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            version="${source_version}-dev.${short_sha}"
            channel="dev"
          else
            version="${source_version}-ci.${short_sha}"
            channel="ci"
          fi

          {
            echo "target=$target"
            echo "source_sha=$source_sha"
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          {
            echo "BLORP_BUILD_VERSION=$version"
            echo "BLORP_BUILD_COMMIT=$source_sha"
            echo "BLORP_BUILD_TARGET=$target"
            echo "BLORP_BUILD_CHANNEL=$channel"
            echo "BLORP_BUILD_DIRTY=false"
          } >> "$GITHUB_ENV"

      - name: Read Blorp compiler bootstrap manifest
        id: compiler-bootstrap
        shell: bash
        run: echo "tag=$(scripts/blorp-compiler-bootstrap --print-tag)" >> "$GITHUB_OUTPUT"

      - name: Cache Blorp compiler bootstrap
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-v2-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config

      - name: Cache generated Blorp CLI
        uses: actions/cache@v4
        with:
          path: compiler/_build/blorp-cli
          key: blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.release-meta.outputs.version }}-${{ steps.release-meta.outputs.source_sha }}-${{ steps.release-meta.outputs.target }}-${{ hashFiles('compiler/blorp/src/**/*.brp', 'std/**/*.brp', 'compiler/bootstrap.env', 'compiler/tools/*.brp', 'compiler/lib/runtime.c', 'compiler/lib/runtime_decl.c', 'compiler/lib/minicoro.h', 'scripts/blorp-compiler-bootstrap') }}
          restore-keys: |
            blorp-cli-v1-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.release-meta.outputs.version }}-${{ steps.release-meta.outputs.source_sha }}-${{ steps.release-meta.outputs.target }}-

      - name: Build compiler
        env:
          BLORP_BUILD_VERSION: ${{ steps.release-meta.outputs.version }}
          BLORP_BUILD_COMMIT: ${{ steps.release-meta.outputs.source_sha }}
          BLORP_BUILD_TARGET: ${{ steps.release-meta.outputs.target }}
          BLORP_BUILD_CHANNEL: ${{ steps.release-meta.outputs.channel }}
          BLORP_BUILD_DIRTY: 'false'
          BLORP_CLI_C_OPTIMIZATION: -Og
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            make -j2 install
          else
            make install
          fi

      - name: Bundle compiler candidate
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/ci-toolchain.tar.gz" \
            blorp \
            compiler/_build/blorp-cli/blorp \
            compiler/_build/blorp-cli/blorp_cli_main.c \
            compiler/_build/blorp-cli/runtime_sources.c \
            compiler/_build/blorp-cli/inputs.sha256 \
            compiler/_build/blorp-cli/build-inputs.sha256 \
            compiler/_build/blorp-cli/blorp.sha256 \
            compiler/_build/blorp-cli/embedded-inputs.sha256 \
            compiler/blorp/src/stage_01_file_io/embedded_std.brp \
            compiler/blorp/src/stage_01_file_io/compiler_build_info.brp

      - name: Upload compiler candidate
        uses: actions/upload-artifact@v4
        with:
          name: ci-toolchain-${{ steps.release-meta.outputs.target }}
          path: ${{ runner.temp }}/ci-toolchain.tar.gz
          compression-level: 0

  test:
    name: Test (${{ matrix.scope }})
    needs: build-toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.test_lanes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiler candidate
        uses: actions/download-artifact@v4
        with:
          name: ci-toolchain-${{ needs.build-toolchain.outputs.target }}
          path: ${{ runner.temp }}

      - name: Restore compiler candidate
        run: tar -xzf "${RUNNER_TEMP}/ci-toolchain.tar.gz"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config

      - name: Read Blorp compiler bootstrap manifest
        if: matrix.run_quality_checks
        id: compiler-bootstrap
        shell: bash
        run: echo "tag=$(scripts/blorp-compiler-bootstrap --print-tag)" >> "$GITHUB_OUTPUT"

      - name: Cache Blorp compiler bootstrap
        if: matrix.run_quality_checks
        uses: actions/cache@v4
        with:
          path: ~/.cache/blorp/compiler-bootstrap
          key: blorp-compiler-bootstrap-v2-${{ steps.compiler-bootstrap.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}

      - name: Run quality checks
        if: matrix.run_quality_checks
        env:
          BLORP_BUILD_VERSION: ${{ needs.build-toolchain.outputs.version }}
          BLORP_BUILD_COMMIT: ${{ needs.build-toolchain.outputs.source_sha }}
          BLORP_BUILD_TARGET: ${{ needs.build-toolchain.outputs.target }}
          BLORP_BUILD_CHANNEL: ${{ needs.build-toolchain.outputs.channel }}
          BLORP_BUILD_DIRTY: 'false'
          BLORP_CLI_C_OPTIMIZATION: -Og
        run: make quality

      - name: Test benchmark-only typecheck worker
        if: matrix.run_quality_checks
        run: |
          benchmarks/compiler_typecheck_memory \
            --type-depth 1 \
            --probes-per-module 1 \
            --runs 1 \
            --warmup-runs 0 \
            --json >/dev/null

      - name: Run test suites
        if: matrix.gates != ''
        env:
          BLORP_COMPILER_TEST_SHARD_INDEX: ${{ matrix.compiler_test_shard_index }}
          BLORP_COMPILER_TEST_SHARD_COUNT: ${{ matrix.compiler_test_shard_count }}
          BLORP_COMPILER_TEST_PROGRESS: ${{ matrix.compiler_test_progress }}
          BLORP_TEST_TIMEOUT: '30'
          BLORP_COMPILER_TEST_TIMEOUT: '180'
        run: |
          set -o pipefail
          bash scripts/test --no-build --serial ${{ matrix.gates }} 2>&1 | tee test_output.txt

      - name: Verify Blorp-owned test route in a stage-two compiler
        if: matrix.run_stage_two
        run: tests/test_cli_stage_two.sh --timeout 30

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ needs.build-toolchain.outputs.target }}-${{ matrix.scope }}
          path: test_output.txt

  package-tested-toolchain:
    name: Package tested toolchain
    needs: [build-toolchain, test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download qualified compiler candidate
        uses: actions/download-artifact@v4
        with:
          name: ci-toolchain-${{ needs.build-toolchain.outputs.target }}
          path: ${{ runner.temp }}

      - name: Restore qualified compiler candidate
        run: tar -xzf "${RUNNER_TEMP}/ci-toolchain.tar.gz"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config

      - name: Package tested toolchain
        env:
          BLORP_RELEASE_TARGET: ${{ needs.build-toolchain.outputs.target }}
        run: scripts/package-release dist

      - name: Smoke tested compiler binary
        shell: bash
        env:
          BLORP_RELEASE_VERSION: ${{ needs.build-toolchain.outputs.version }}
          BLORP_RELEASE_COMMIT: ${{ needs.build-toolchain.outputs.source_sha }}
          BLORP_RELEASE_TARGET: ${{ needs.build-toolchain.outputs.target }}
          BLORP_RELEASE_CHANNEL: ${{ needs.build-toolchain.outputs.channel }}
        run: |
          set -euo pipefail
          package_root=$(mktemp -d "${RUNNER_TEMP}/blorp-package-smoke.XXXXXX")
          trap 'rm -rf "$package_root"' EXIT
          release_binary="$PWD/dist/blorp-${BLORP_RELEASE_TARGET}"
          test -x "$release_binary"
          isolated_compiler_dir="$package_root/isolated-compiler"
          mkdir -p "$isolated_compiler_dir"
          cp "$release_binary" "$isolated_compiler_dir/blorp"
          "$isolated_compiler_dir/blorp" compile --no-format \
            -o "$package_root/isolated-empty-main.c" \
            "$PWD/tests/test_blorp/memory/leak_check_baselines/empty_main.brp"
          test -s "$package_root/isolated-empty-main.c"
          source_root="$PWD"
          cd "$package_root"
          version_output=$("$isolated_compiler_dir/blorp" --version)
          grep -Fxq "blorp ${BLORP_RELEASE_VERSION}" <<<"$version_output"
          grep -Fxq "commit: ${BLORP_RELEASE_COMMIT}" <<<"$version_output"
          grep -Fxq "target: ${BLORP_RELEASE_TARGET}" <<<"$version_output"
          grep -Fxq "channel: ${BLORP_RELEASE_CHANNEL}" <<<"$version_output"
          grep -Fxq "dirty: false" <<<"$version_output"
          "$isolated_compiler_dir/blorp" check --no-format \
            "$source_root/compiler/blorp/src/stage_12_cli/main.brp"
          printf 'func helper(x: Int) -> Int:\n\tx + 1\n' > "$package_root/purify-smoke.brp"
          "$isolated_compiler_dir/blorp" purify --dry-run "$package_root/purify-smoke.brp"
          "$isolated_compiler_dir/blorp" test --timeout 5 \
            "$source_root/tests/test_blorp/types/test_bool.brp"

      - name: Upload tested compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: blorp-${{ needs.build-toolchain.outputs.target }}
          path: dist/blorp-${{ needs.build-toolchain.outputs.target }}
          compression-level: 0
